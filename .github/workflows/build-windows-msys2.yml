name: Build Windows (MSYS2 / BDB 6.2 + Qt5)

# Windows-native build using MSYS2 + MinGW-w64 on GitHub's windows-latest
# runner. Produces a portable ZIP with all six release executables, linked
# statically against Berkeley DB 6.2 and Qt5. No runtime DLLs are required.
#
# Triggers automatically on every v* tag — no manual rebuild needed at
# release time. Runs alongside the standard Guix matrix so Linux/macOS
# stay on the canonical BDB 4.8 path and Windows gets BDB 6.2 + Qt5.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows-msys2:
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            autoconf
            automake
            libtool
            make
            pkg-config
            python
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-rust
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-db
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-libevent
            mingw-w64-x86_64-zeromq
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-miniupnpc
            mingw-w64-x86_64-libnatpmp
            mingw-w64-x86_64-qt5-static
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-harfbuzz
            mingw-w64-x86_64-zstd

      - name: Show toolchain
        run: |
          gcc --version | head -1
          rustc --version
          cargo --version
          pkg-config --modversion libdb_cxx || true
          pacman -Qi mingw-w64-x86_64-db 2>/dev/null | head -5 || true
          ls /mingw64/qt5-static/bin/qmake.exe && /mingw64/qt5-static/bin/qmake.exe -v || true

      - name: Resolve package version
        run: |
          VERSION=$(python -c 'import re; d=dict(re.findall(r"^define\(_CLIENT_VERSION_(MAJOR|MINOR|BUILD),\s*([^)]+)\)", open("configure.ac").read(), re.M)); print(".".join(d[k] for k in ("MAJOR", "MINOR", "BUILD")))')
          echo "KORSH_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building Korsh Core v$VERSION"

      - name: autogen
        run: ./autogen.sh

      - name: Debug Qt5-static layout
        run: |
          set +e
          echo "--- /mingw64/qt5-static/ root ---"
          ls /mingw64/qt5-static/
          echo "--- /mingw64/qt5-static/share/ ---"
          ls /mingw64/qt5-static/share/ 2>/dev/null
          echo "--- find libqminimal.a anywhere ---"
          find /mingw64 -name 'libqminimal*' 2>/dev/null | head
          echo "--- find libq*.a under /mingw64/qt5-static/ ---"
          find /mingw64/qt5-static -name 'libq*.a' 2>/dev/null | head -30
          echo "--- find any .a containing 'minimal' or 'windows' under qt5-static ---"
          find /mingw64/qt5-static \( -name '*minimal*' -o -name '*qwindows*' \) 2>/dev/null | head -40
          echo "--- libQt5*.a (lib/) ---"
          ls /mingw64/qt5-static/lib/libQt5*.a 2>/dev/null | head -20
          echo "--- pkgconfig content ---"
          ls /mingw64/qt5-static/lib/pkgconfig/ 2>/dev/null | head -40
          true

      - name: Synthesize .pc stubs for Qt5 private support modules
        # bitcoin_qt.m4 looks up Qt5AccessibilitySupport / ThemeSupport /
        # FontDatabaseSupport / etc via PKG_CHECK_MODULES, but MSYS2's
        # qt5-static package only ships .pc files for the public Qt5
        # modules — not the private internal *Support libraries (whose
        # static .a files are shipped). Generate minimal .pc stubs that
        # point at the static archives so configure can finish detection.
        run: |
          QT_PKGCFG=/mingw64/qt5-static/lib/pkgconfig
          QT_LIBDIR=/mingw64/qt5-static/lib
          QT_INCDIR=/mingw64/qt5-static/include
          QT_VERSION=$(/mingw64/qt5-static/bin/qmake.exe -query QT_VERSION 2>/dev/null | tr -d '\r' || echo 5.15.18)
          echo "Qt version: $QT_VERSION"
          echo "--- existing pkgconfig modules ---"
          ls $QT_PKGCFG | grep -i "Qt5" | head -20
          echo "--- missing modules will be stubbed ---"
          for mod in AccessibilitySupport DeviceDiscoverySupport EdidSupport EventDispatcherSupport FbSupport FontDatabaseSupport ThemeSupport WindowsUIAutomationSupport VulkanSupport; do
            pc="$QT_PKGCFG/Qt5$mod.pc"
            lib="$QT_LIBDIR/libQt5$mod.a"
            if [ -f "$pc" ]; then
              echo "  Qt5$mod: .pc already exists"
            elif [ -f "$lib" ]; then
              cat > "$pc" <<EOF
          prefix=/mingw64/qt5-static
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: Qt5$mod
          Description: Qt5 $mod private support module (MSYS2 stub)
          Version: $QT_VERSION
          Libs: -L\${libdir} -lQt5$mod
          Cflags: -I\${includedir}/Qt5$mod -I\${includedir}
          EOF
              echo "  Qt5$mod: stubbed → $pc"
            else
              echo "  Qt5$mod: NEITHER .pc NOR .a exists, skipping"
            fi
          done

      - name: configure
        run: |
          # Fully static build: BDB 6.2, Qt5, libgcc, libstdc++, winpthread
          # all baked into the .exe so it drops on a clean Windows install
          # with no DLLs alongside.
          #
          # MSYS2's /mingw64/lib/libdb_cxx.a is actually the *import library*
          # for libdb_cxx-6.2.dll (1.6 MB stub). The true static archive is
          # libdb_cxx-6.2.a (2.6 MB, contains the .o files). Pointing
          # BDB_LIBS at that pulls Berkeley DB 6.2 into the binary.
          #
          # qt5-static lives at /mingw64/qt5-static/ in MSYS2 — its
          # .pc files ship the full static-link dependency list (libpng,
          # harfbuzz, freetype, pcre2, zlib, qtpcre2, etc.) so configure
          # picks them up via PKG_CONFIG_PATH. --with-gui=qt5 forces qt5.
          #
          # -static + -static-libgcc + -static-libstdc++ avoid the
          # libgcc_s_seh-1.dll / libstdc++-6.dll / libwinpthread-1.dll
          # runtime deps that mingw normally introduces.
          export PKG_CONFIG_PATH=/mingw64/qt5-static/lib/pkgconfig:/mingw64/lib/pkgconfig
          export PATH=/mingw64/qt5-static/bin:$PATH
          # configure turns pkg-config's -I/mingw64/include into
          # -isystem /mingw64/include, which breaks the GCC C++ headers
          # (#include_next <stdlib.h>). Keep pkg-config from emitting it.
          export PKG_CONFIG_SYSTEM_INCLUDE_PATH=/mingw64/include
          ./configure \
            --disable-bench \
            --disable-tests \
            --disable-gui-tests \
            --disable-stacktraces \
            --with-gui=qt5 \
            --with-qt-bindir=/mingw64/qt5-static/bin \
            --with-qt-incdir=/mingw64/qt5-static/include \
            --with-qt-libdir=/mingw64/qt5-static/lib \
            --with-qt-plugindir=/mingw64/qt5-static/share/qt5/plugins \
            --with-incompatible-bdb \
            --disable-maintainer-mode \
            --disable-dependency-tracking \
            BDB_LIBS="/mingw64/lib/libdb_cxx-6.2.a" \
            LIBS="-L/mingw64/qt5-static/lib -L/mingw64/lib -lqtlibpng -lqtharfbuzz -lqtpcre2 -lz -lzstd -lfreetype -lbz2 -lpng16 -lgraphite2 -lbrotlidec -lbrotlicommon -lpcre2-8 -lusp10 -lrpcrt4 -lgdi32 -lole32 -loleaut32 -luuid -luser32 -lws2_32 -ladvapi32 -lkernel32" \
            LDFLAGS="-static -static-libgcc -static-libstdc++ -L/mingw64/qt5-static/lib -L/mingw64/qt5-static/share/qt5/plugins/platforms -L/mingw64/qt5-static/share/qt5/plugins/styles" \
            || (cat config.log; false)

      - name: make
        run: make -C src -j2 korshd.exe korsh-cli.exe korsh-tx.exe korsh-wallet.exe korsh-util.exe qt/korsh-qt.exe

      - name: Collect all six release executables
        run: |
          mkdir -p artifacts/korsh-windows-msys2/bin artifacts/korsh-windows-msys2/params
          cp src/korshd.exe       artifacts/korsh-windows-msys2/bin/
          cp src/korsh-cli.exe    artifacts/korsh-windows-msys2/bin/
          cp src/korsh-tx.exe     artifacts/korsh-windows-msys2/bin/
          cp src/korsh-util.exe   artifacts/korsh-windows-msys2/bin/
          cp src/korsh-wallet.exe artifacts/korsh-windows-msys2/bin/
          cp src/qt/korsh-qt.exe  artifacts/korsh-windows-msys2/bin/
          cp params/sapling-spend.params params/sapling-output.params artifacts/korsh-windows-msys2/params/
          for exe in artifacts/korsh-windows-msys2/bin/*.exe; do
            strip "$exe"
            file "$exe"
          done
          python - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          bins = sorted(Path("artifacts/korsh-windows-msys2/bin").glob("*.exe"))
          if len(bins) != 6:
              raise SystemExit(f"Expected six release executables, found {len(bins)}")
          system32 = Path(os.environ["SystemRoot"]) / "System32"
          for binary in bins:
              output = subprocess.check_output(["objdump", "-p", str(binary)], text=True)
              imports = re.findall(r"DLL Name:\s*(\S+)", output)
              if binary.name == "korsh-qt.exe" and "Windows GUI" not in output:
                  raise SystemExit("korsh-qt.exe is not linked as a Windows GUI subsystem application")
              external = [dll for dll in imports
                          if not dll.lower().startswith(("api-ms-win-", "ext-ms-win-"))
                          and not (system32 / dll).is_file()]
              if external:
                  raise SystemExit(f"{binary.name} imports DLLs absent from Windows System32: {external}")
              print(f"{binary.name}: {len(imports)} imports, all are Windows system DLLs")
          PY
          echo "=== BDB version baked in ==="
          python -c 'from pathlib import Path; import re; b=Path("artifacts/korsh-windows-msys2/bin/korshd.exe").read_bytes(); m=re.search(rb"Berkeley DB [0-9.]+", b); print(m.group(0).decode() if m else "No embedded BDB version string")'

      - name: Assemble ZIP and smoke-test extracted package
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE "artifacts\korsh-windows-msys2"
          $bin = Join-Path $stage "bin"
          $docs = Join-Path $stage "docs"
          New-Item -ItemType Directory -Force -Path $docs | Out-Null
          Copy-Item "doc/README_windows.txt" (Join-Path $stage "README.txt")
          Copy-Item "COPYING" (Join-Path $stage "COPYING")
          Copy-Item "doc/masternode-setup-smt-windows-qt.md" (Join-Path $docs "Masternode-Setup.md")
          Copy-Item "doc/release-notes/korsh/release-notes-0.0.6.md" (Join-Path $docs "Release-Notes.md")

          $zip = Join-Path $env:GITHUB_WORKSPACE "korsh-$env:KORSH_VERSION-win64.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -CompressionLevel Optimal -Force
          $unpack = Join-Path $env:RUNNER_TEMP "korsh-release-smoke"
          Expand-Archive -Path $zip -DestinationPath $unpack -Force
          $bin = Join-Path $unpack "bin"
          foreach ($param in @("sapling-spend.params", "sapling-output.params")) {
            if (-not (Test-Path (Join-Path $unpack "params\$param"))) { throw "Missing Sapling parameter: $param" }
          }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $version = [string]$env:KORSH_VERSION

          foreach ($name in @("korshd.exe", "korsh-cli.exe", "korsh-tx.exe", "korsh-util.exe", "korsh-wallet.exe")) {
            $output = & (Join-Path $bin $name) -version 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0 -or $output -notmatch [regex]::Escape($version)) {
              throw "Version smoke failed for $name (expected $version): $output"
            }
            Write-Host "$name version verified: $version"
          }
          $qtVersion = (Get-Item (Join-Path $bin "korsh-qt.exe")).VersionInfo.ProductVersion
          if ($qtVersion -notmatch [regex]::Escape($version)) {
            throw "korsh-qt.exe ProductVersion is '$qtVersion', expected $version"
          }
          Write-Host "korsh-qt.exe ProductVersion verified: $qtVersion"
          $qtProcess = Start-Process -FilePath (Join-Path $bin "korsh-qt.exe") -ArgumentList "-version" -PassThru -WindowStyle Hidden
          if (-not $qtProcess.WaitForExit(30000)) {
            Stop-Process -Id $qtProcess.Id -Force
            throw "korsh-qt.exe -version did not exit within 30 seconds"
          }
          if ($qtProcess.ExitCode -ne 0) { throw "korsh-qt.exe -version exited with $($qtProcess.ExitCode)" }
          Write-Host "korsh-qt.exe runtime version smoke passed"

          $datadir = Join-Path $env:RUNNER_TEMP "korsh-regtest-wallet-mode"
          $daemon = Join-Path $bin "korshd.exe"
          $cli = Join-Path $bin "korsh-cli.exe"
          $baseDaemonArgs = @("-regtest", "-datadir=$datadir", "-server=1", "-listen=0", "-txindex=1", "-peerblockfilters=1", "-blockfilterindex=basic")
          $rpcArgs = @("-regtest", "-datadir=$datadir", "-rpcwait")
          $process = $null
          try {
            $process = Start-Process -FilePath $daemon -ArgumentList $baseDaemonArgs -PassThru -WindowStyle Hidden
            & $cli @rpcArgs getblockcount | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Regtest RPC did not become ready" }
            & $cli @rpcArgs createwallet "release-smoke" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Wallet creation failed before masternode startup" }
            $blsOutput = & $cli @rpcArgs bls generate
            if ($LASTEXITCODE -ne 0) { throw "Could not generate a regtest BLS key" }
            $blsInfo = $blsOutput | ConvertFrom-Json
            if (-not $blsInfo.secret) { throw "BLS generation returned no secret" }
            & $cli @rpcArgs stop | Out-Null
            if ($LASTEXITCODE -ne 0 -or -not $process.WaitForExit(60000)) { throw "Initial regtest node did not stop cleanly" }

            $masternodeArgs = $baseDaemonArgs + "-masternodeblsprivkey=$($blsInfo.secret)" + "-wallet=release-smoke"
            $process = Start-Process -FilePath $daemon -ArgumentList $masternodeArgs -PassThru -WindowStyle Hidden
            & $cli @rpcArgs getblockcount | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Regtest node with masternode key did not become ready" }
            $walletOutput = & $cli @rpcArgs listwallets
            if ($LASTEXITCODE -ne 0) { throw "listwallets failed after masternode startup" }
            $loadedWallets = @($walletOutput | ConvertFrom-Json)
            if ($loadedWallets -notcontains "release-smoke") {
              throw "Wallet did not load when starting with -masternodeblsprivkey"
            }
            $debugLog = Join-Path $datadir "regtest\debug.log"
            $logText = Get-Content -Path $debugLog -Raw
            if ($logText -notmatch "Using BerkeleyDB version Berkeley DB 6\.2") {
              throw "Expected the existing Windows BDB 6.2 wallet backend; check $debugLog"
            }
            $walletArgs = @("-regtest", "-datadir=$datadir", "-rpcwallet=release-smoke", "-rpcwait")
            $address = & $cli @walletArgs getnewaddress
            if ($LASTEXITCODE -ne 0 -or -not $address) { throw "Wallet address creation failed" }
            & $cli @walletArgs generatetoaddress 101 $address | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Regtest mining failed" }
            $balance = [double](& $cli @walletArgs getbalance)
            if ($LASTEXITCODE -ne 0 -or $balance -le 0) { throw "Wallet balance did not increase after mining" }
            $destination = & $cli @walletArgs getnewaddress
            if ($LASTEXITCODE -ne 0 -or -not $destination) { throw "Destination address creation failed" }
            $txid = & $cli @walletArgs sendtoaddress $destination 1
            if ($LASTEXITCODE -ne 0 -or $txid.Length -ne 64) { throw "Wallet transaction smoke failed: $txid" }
            Write-Host "Wallet + masternode-key regtest smoke passed; balance=$balance txid=$txid"
          } finally {
            if ($process -and -not $process.HasExited) {
              & $cli @rpcArgs stop 2>$null | Out-Null
              if (-not $process.WaitForExit(60000)) { Stop-Process -Id $process.Id -Force }
            }
          }
          Write-Host "Portable ZIP created: $zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: korsh-windows-msys2
          path: korsh-${{ env.KORSH_VERSION }}-win64.zip
          retention-days: 30
